name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: App tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  caddy:
    name: Caddyfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Caddyfile with Caddy 2.11.4
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine \
            caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile \
            > /tmp/caddy.json
          python3 deploy/check-caddyfile.py /tmp/caddy.json
